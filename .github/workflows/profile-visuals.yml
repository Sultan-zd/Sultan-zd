name: Profile visuals (3D contributions + snake)

on:
  schedule: # every day at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Prepare snake folder
        run: mkdir -p profile-snake

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-snake/github-snake.svg?color_snake=#0F2A44&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0284c7
            profile-snake/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0c3a5e,#1F6FB2,#38bdf8,#22d3ee

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update profile visuals"; then
            git push
          fi
